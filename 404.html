<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Tehlikeli Bölge | Beyond Rayfel</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140a08;
    --sand:#ecd3b8;
    --muted:#b99c86;
    --rust:#d4501a;
    --warn:#f2b632;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--sand);
    font-family:'Barlow',system-ui,sans-serif;
    display:flex;flex-direction:column;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  .tape{
    position:relative;z-index:1;height:14px;
    background:repeating-linear-gradient(-45deg,var(--warn) 0 18px,#1a1008 18px 36px);
  }

  main{
    position:relative;z-index:1;
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(24px,5vw,56px) 20px;
  }

  .code{
    display:flex;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;
    font-size:clamp(9rem,30vw,22rem);
    line-height:.8;
    letter-spacing:-.01em;
    color:var(--sand);
    gap:.02em;
  }
  .code span{display:block}
  .code svg{
    width:.74em;height:.74em;display:block;
    margin:0 .03em;
    animation:turn 90s linear infinite;
  }
  @keyframes turn{to{transform:rotate(360deg)}}

  .alert{
    margin-top:clamp(20px,4vw,40px);
    display:inline-flex;align-items:center;gap:10px;
    background:var(--warn);color:#1a1008;
    font-weight:600;font-size:.95rem;
    padding:6px 14px;border-radius:3px;
  }
  .alert svg{width:18px;height:18px}

  h1{
    font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:clamp(1.9rem,5vw,3.4rem);
    line-height:1.05;
    margin:18px 0 14px;
    max-width:20ch;
  }
  p.msg{
    color:var(--muted);font-size:1.1rem;line-height:1.55;
    max-width:44ch;margin-bottom:28px;
  }
  .btn{
    display:inline-block;text-decoration:none;
    background:var(--rust);color:#fff;
    font-weight:600;font-size:1.05rem;
    padding:14px 28px;border-radius:4px;
    transition:background .15s;
  }
  .btn:hover{background:#e86428}
  .btn:focus-visible{outline:3px solid var(--sand);outline-offset:3px}

  footer{
    position:relative;z-index:1;
    border-top:1px solid rgba(236,211,184,.15);
    padding:20px clamp(16px,4vw,48px) 24px;
    display:flex;align-items:center;justify-content:center;
    gap:clamp(20px,5vw,56px);flex-wrap:wrap;
  }
  footer img{height:clamp(44px,7vw,68px);width:auto;display:block}
  footer .sep{width:1px;height:40px;background:rgba(236,211,184,.25)}

  .lang{
    position:absolute;top:16px;right:clamp(16px,4vw,48px);z-index:2;
    display:flex;border:1px solid rgba(236,211,184,.35);border-radius:4px;overflow:hidden;
  }
  .lang button{
    background:none;border:0;color:var(--muted);
    font:600 .85rem 'Barlow',sans-serif;padding:6px 12px;cursor:pointer;
  }
  .lang button[aria-pressed="true"]{background:var(--sand);color:#1a1008}
  .lang button:focus-visible{outline:3px solid var(--warn);outline-offset:-3px}
  body{position:relative}

  @media (prefers-reduced-motion:reduce){.code svg{animation:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="tape" aria-hidden="true"></div>
<div class="lang" role="group" aria-label="Language / Dil">
  <button type="button" data-lang="tr" aria-pressed="true">TR</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>

<main>
  <div class="code" role="img" aria-label="404">
    <span>4</span>
    <!-- Mars: sıfırın yerine -->
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <clipPath id="disc"><circle cx="100" cy="100" r="98"/></clipPath>
        <radialGradient id="shade" cx="35%" cy="30%" r="85%">
          <stop offset="0" stop-color="#000" stop-opacity="0"/>
          <stop offset=".6" stop-color="#000" stop-opacity=".12"/>
          <stop offset="1" stop-color="#000" stop-opacity=".6"/>
        </radialGradient>
      </defs>
      <g clip-path="url(#disc)">
        <rect width="200" height="200" fill="#c4572a"/>
        <path d="M-10 70 C40 50 70 85 120 70 S180 55 215 75 L215 100 C170 90 130 110 90 100 S20 95 -10 105Z" fill="#a94420"/>
        <path d="M-10 130 C30 120 60 145 105 135 S170 125 215 145 L215 215 L-10 215Z" fill="#b24c24"/>
        <path d="M40 112 C70 106 110 118 150 108" stroke="#5e220e" stroke-width="7" stroke-linecap="round" fill="none" opacity=".75"/>
        <ellipse cx="100" cy="6" rx="46" ry="14" fill="#f3ece4"/>
        <circle cx="62" cy="56" r="11" fill="#8f3a19"/>
        <circle cx="64" cy="58" r="7" fill="#a94420"/>
        <circle cx="140" cy="48" r="7" fill="#8f3a19"/>
        <circle cx="145" cy="150" r="14" fill="#8f3a19"/>
        <circle cx="147" cy="152" r="9" fill="#a94420"/>
        <circle cx="58" cy="156" r="6" fill="#8f3a19"/>
        <circle cx="100" cy="100" r="98" fill="url(#shade)"/>
      </g>
    </svg>
    <span>4</span>
  </div>

  <div class="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18v.5"/></svg>
    <span data-tr="Hayati tehlike" data-en="Life-threatening hazard">Hayati tehlike</span>
  </div>
  <h1 data-tr="Bu koordinatta hayati tehlikeler var." data-en="This location is life-threatening.">Bu koordinatta hayati tehlikeler var.</h1>
  <p class="msg" data-tr="Aradığın sayfa burada değil, oksijen seviyesi de düşüyor. Vakit kaybetmeden rover’a geri dön." data-en="The page you are looking for is not here, and oxygen is running low. Get back to the rover now.">Aradığın sayfa burada değil, oksijen seviyesi de düşüyor. Vakit kaybetmeden rover’a geri dön.</p>
  <a class="btn" href="/" data-tr="Rover’a geri dön" data-en="Back to the rover">Rover’a geri dön</a>
</main>

<footer>
  <img src="logo.png" alt="Beyond Rayfel logosu">
  <span class="sep" aria-hidden="true"></span>
  <img src="nasa.png" alt="NASA logosu">
  <span class="sep" aria-hidden="true"></span>
  <img src="spaceApps.png" alt="NASA Space Apps Challenge logosu">
</footer>

<script>
  (function(){
    var c=document.getElementById('stars'),x=c.getContext('2d');
    function draw(){
      c.width=innerWidth;c.height=innerHeight;
      x.fillStyle='#ecd3b8';
      var n=Math.floor(c.width*c.height/9000);
      for(var i=0;i<n;i++){
        x.globalAlpha=Math.random()*.6+.15;
        x.beginPath();
        x.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.2+.2,0,6.283);
        x.fill();
      }
    }
    addEventListener('resize',draw);draw();
  })();
</script>
<script>
  (function(){
    var btns=document.querySelectorAll('.lang button');
    function setLang(l){
      document.documentElement.lang=l;
      document.querySelectorAll('[data-tr]').forEach(function(el){el.textContent=el.getAttribute('data-'+l)});
      document.title=l==='en'?'404 – Danger Zone | Beyond Rayfel':'404 – Tehlikeli Bölge | Beyond Rayfel';
      btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l)});
      try{localStorage.setItem('lang',l)}catch(e){}
    }
    btns.forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang)})});
    var saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
    var l=saved||((navigator.language||'tr').toLowerCase().indexOf('tr')===0?'tr':'en');
    setLang(l);
  })();
</script>
</body>
</html>
