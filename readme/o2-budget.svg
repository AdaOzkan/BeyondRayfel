<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Inter,Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="250" rx="16" fill="#f4f2ef"/>
<text x="30" y="36" font-size="17" font-weight="700" fill="#0d7f74">O₂ budget of the worked example (8 h supply = 480 min)</text>
<!-- scale 0.86 px/min: 480 min = 413 px -->
<g transform="translate(30,60)">
<rect x="0" y="0" width="289" height="44" fill="#0d7f74"/><text x="144" y="27" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">336 min usable (70 %)</text>
<rect x="289" y="0" width="124" height="44" fill="#cf3d32" fill-opacity=".85"/><text x="351" y="27" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">144 min reserve</text>
<text x="0" y="66" font-size="12" fill="#647477">never counted in the margin</text>
</g>
<g transform="translate(30,150)">
<rect x="0" y="0" width="139" height="44" fill="#4cd6ff"/><text x="70" y="27" font-size="13" font-weight="700" text-anchor="middle" fill="#06191a">162 min travel</text>
<rect x="139" y="0" width="108" height="44" fill="#ffb347"/><text x="193" y="27" font-size="13" font-weight="700" text-anchor="middle" fill="#06191a">125 min stops</text>
<rect x="247" y="0" width="42" height="44" fill="#3be07a"/><text x="268" y="27" font-size="12" font-weight="700" text-anchor="middle" fill="#06191a">49</text>
<text x="0" y="66" font-size="12" fill="#647477">8088 m ÷ 0.83 m/s + 5 × 25 min → margin 49.2 min ✓</text>
</g>
<g font-size="13" fill="#1c2a2c"><text x="520" y="90" font-weight="700">Formulas used by the app</text>
<text x="520" y="116" font-family="monospace">t_travel = L / v</text><text x="520" y="138" font-family="monospace">t_stop   = N × tₛ</text>
<text x="520" y="160" font-family="monospace">O₂_usable = 8 h × (1 − 0.30) = 336 min</text>
<text x="520" y="182" font-family="monospace">Margin = 336 − (t_travel + t_stop)</text>
<text x="520" y="212" font-family="monospace">Dose = 0.67/24 × k × t_total (k = 5 in SPE)</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
