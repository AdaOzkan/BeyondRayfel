<!doctype html>
<html>
    <head>
        <meta charset=utf8>
        <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
        <style>
            :root {
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px)
            }

            html {
                scroll-padding-top: env(safe-area-inset-top,0px)
            }

            body {
                margin: 0;
                padding: 0;
                font: 14px -apple-system,BlinkMacSystemFont,sans-serif;
                background: #fff;
                color: #000
            }

            img {
                max-width: 100%
            }

            [hidden]:not([hidden=until-found i]) {
                display: none!important
            }
        </style>
    </head>
    <body>
        <meta name="claude:viewport-fit-sides" content="cover">
        <title>Beyond Rayfel</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
        <style>
            /* Layout: a full-bleed night sky. A rust-banded ringed planet sits dead centre (sphere = 65% of the short side),
   its name set huge and outlined behind it. Section links are diamond markers on the near arc of the ring. */
            :root {
                --void: #06070c;
                --bone: #ece3d0;
                --rust: #b5532e;
                --ochre: #d49a58;
                --ice: #f4f1e8;
                --dim: #8a92a8;
                --line: rgba(244, 241, 232, 0.24);
                --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
                --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
                color-scheme: dark;
            }

            html, body {
                height: 100%;
            }

            body {
                margin: 0;
                box-sizing: border-box;
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
                background: var(--void);
                color: var(--bone);
                font-family: var(--mono);
                overflow: hidden;
            }

            canvas {
                display: block;
            }

            .sky {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .rig, .back {
                position: absolute;
                inset: 0;
                will-change: transform;
            }

            .fx {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            .vignette {
                position: fixed;
                inset: 0;
                z-index: 2;
                pointer-events: none;
                background: radial-gradient(ellipse at 50% 50%, rgba(2, 3, 8, 0) 52%, rgba(2, 3, 8, 0.66) 100%);
            }

            /* world = planet layer, shifts aside when a panel opens */
            .world {
                position: fixed;
                inset: 0;
                touch-action: none;
                cursor: grab;
                transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .orb {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            @media (min-width: 700px) {
                .world.shifted {
                    transform: translateX(calc(-1 * min(210px, 18vw)));
                }
            }

            @media (max-width: 699px) {
                .world.shifted {
                    transform: translateY(-24vh) scale(0.82);
                }
            }

            .wordmark {
                position: absolute;
                inset: 0;
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: center;
                gap: 0.22em;
                pointer-events: none;
                font-family: var(--display);
                font-weight: 900;
                text-transform: uppercase;
                font-size: min(10.5vw, 46vh);
                line-height: 0.9;
                letter-spacing: 0.02em;
                color: rgba(236, 227, 208, 0.02);
                -webkit-text-stroke: 1.5px rgba(236, 227, 208, 0.13);
                opacity: 0;
                animation: wm 2.6s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            }

            .wordmark span {
                white-space: nowrap;
            }

            @media (max-width: 699px) {
                .wordmark {
                    flex-direction: column;
                    gap: 0.04em;
                    font-size: 26vw;
                }
            }

            @keyframes wm {
                from {
                    opacity: 0;
                    transform: scale(1.08);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            /* ring markers */
            .nodes {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .node {
                position: absolute;
                width: 44px;
                height: 44px;
                margin: -22px 0 0 -22px;
                padding: 0;
                border: 0;
                background: none;
                color: inherit;
                cursor: pointer;
                opacity: var(--o, 0);
                transform: scale(var(--s, 0.5));
                pointer-events: none;
            }

            .nodes.on .node {
                pointer-events: auto;
            }

            .node.active .dot::before {
                content: "";
                position: absolute;
                inset: -6px;
                border: 1px solid #f4f1e8;
                animation: pulse 1.3s ease-out;
            }

            @keyframes pulse {
                from {
                    transform: scale(0.6);
                    opacity: 0.9;
                }

                to {
                    transform: scale(3.4);
                    opacity: 0;
                }
            }

            .dot {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 11px;
                height: 11px;
                margin: -5.5px 0 0 -5.5px;
                border: 1.5px solid #f4f1e8;
                background: var(--void);
                transform: rotate(45deg);
                box-shadow: 0 0 0 4px rgba(244, 241, 232, 0.14);
                transition: background 0.2s, box-shadow 0.2s;
            }

            .lbl {
                position: absolute;
                left: 50%;
                top: 100%;
                transform: translateX(-50%);
                white-space: nowrap;
                font: 500 12px/1 var(--mono);
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--bone);
                text-shadow: 0 0 8px #000, 0 1px 3px #000, 0 0 14px #000;
                opacity: var(--l, 0);
                transition: opacity 0.3s, color 0.2s;
            }

            .node.up .lbl {
                top: auto;
                bottom: 100%;
            }

            .node:hover .dot, .node.active .dot {
                background: var(--ice);
                box-shadow: 0 0 0 6px rgba(244, 241, 232, 0.2), 0 0 24px rgba(244, 241, 232, 0.5);
            }

            .node:hover .lbl, .node.active .lbl {
                color: var(--ice);
            }

            .node:hover .lbl, .node.active .lbl, .node:focus-visible .lbl {
                opacity: 1;
            }

            .node:focus-visible {
                outline: none;
            }

            .node:focus-visible .dot {
                outline: 2px solid var(--bone);
                outline-offset: 5px;
            }

            @media (max-width: 699px) {
                .lbl {
                    font-size: 10px;
                    letter-spacing: 0.1em;
                }
            }

            /* chrome */
            .top, .bottom {
                position: fixed;
                left: 0;
                right: 0;
                z-index: 10;
                box-sizing: border-box;
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
                display: flex;
                justify-content: space-between;
                gap: 16px;
                pointer-events: none;
            }

            .top {
                top: 0;
                padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
                align-items: center;
            }

            .bottom {
                bottom: 0;
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
                align-items: flex-end;
                flex-wrap: wrap;
                font-size: 11px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--dim);
            }

            .bottom .clocks {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 20px;
                min-width: 0;
            }

            .bottom b {
                font-weight: 500;
                color: var(--bone);
                font-variant-numeric: tabular-nums;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 14px;
                min-width: 0;
            }

            .logos {
                display: flex;
                align-items: center;
                gap: 12px;
                pointer-events: auto;
            }

            .logo {
                width: 54px;
                height: 54px;
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .logo img {
                display: block;
                width: 125%;
                height: 125%;
                object-fit: contain;
            }

            .logo-divider {
                width: 1px;
                height: 36px;
                background-color: #ffffff;
                flex: none;
            }

            .spaceapps-link {
                pointer-events: auto;
                display: flex;
                align-items: center;
            }

            .spaceapps-logo {
                width: 85px;
                height: auto;
                display: block;
                object-fit: contain;
            }

            .school {
                min-width: 0;
            }

            .school h1 {
                margin: 0;
                font: 800 clamp(20px, 2.8vw, 28px)/1 var(--display);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                text-wrap: balance;
            }

            .school p {
                margin: 5px 0 0;
                font-size: 10px;
                line-height: 1.5;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--dim);
            }

            .chip {
                text-align: right;
                font-size: 10px;
                line-height: 1.6;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--ice);
            }

            .chip span {
                display: block;
                color: var(--dim);
            }

            @media (max-width: 559px) {
                .chip {
                    display: none;
                }
            }

            @media (max-width: 699px) {
                .hint {
                    bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
                }

                .bottom {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 4px;
                }

                .bottom .clocks {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 4px;
                }
            }

            .hint {
                position: fixed;
                left: 0;
                right: 0;
                z-index: 5;
                text-align: center;
                margin: 0;
                bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
                font-size: 11px;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: var(--dim);
                opacity: 0;
                transition: opacity 1.2s 0.6s;
                pointer-events: none;
            }

            .hint.on {
                opacity: 1;
            }

            .hint.off {
                opacity: 0 !important;
                transition-delay: 0s;
            }

            /* section panel */
            .panel {
                position: fixed;
                z-index: 30;
                top: 0;
                right: 0;
                bottom: 0;
                width: min(420px, 100%);
                box-sizing: border-box;
                overflow: auto;
                padding: calc(env(safe-area-inset-top, 0px) + 84px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 28px;
                background: rgba(7, 9, 17, 0.84);
                border-left: 1px solid var(--line);
                -webkit-backdrop-filter: blur(14px);
                backdrop-filter: blur(14px);
                opacity: 0;
                transform: translateX(28px);
                transition: opacity 0.35s, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .panel.open {
                opacity: 1;
                transform: none;
            }

            .panel .close {
                position: absolute;
                top: calc(env(safe-area-inset-top, 0px) + 16px);
                right: max(16px, env(safe-area-inset-right, 0px));
                width: 44px;
                height: 44px;
                display: grid;
                place-items: center;
                background: none;
                border: 1px solid var(--line);
                color: var(--bone);
                cursor: pointer;
            }

            .panel .close:hover {
                border-color: var(--ice);
                color: var(--ice);
            }

            .panel .close:focus-visible {
                outline: 2px solid var(--bone);
                outline-offset: 3px;
            }

            .eyebrow {
                margin: 0 0 12px;
                font-size: 11px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--ice);
            }

            .panel h2 {
                margin: 0;
                font: 900 clamp(38px, 6vw, 56px)/0.95 var(--display);
                text-transform: uppercase;
                letter-spacing: 0.02em;
                text-wrap: balance;
            }

            .empty {
                margin-top: 28px;
                padding: 18px 0 0;
                border-top: 1px solid var(--line);
                font-size: 13px;
                line-height: 1.65;
            }

            .empty p {
                margin: 0;
            }

            .empty .dim {
                margin-top: 6px;
                color: var(--dim);
            }

            @media (max-width: 699px) {
                .panel {
                    top: auto;
                    left: 0;
                    width: auto;
                    height: min(50vh, 420px);
                    padding: 28px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
                    border-left: 0;
                    border-top: 1px solid var(--line);
                    transform: translateY(28px);
                }

                .panel .close {
                    top: 12px;
                }
            }

            .pager {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }

            .pager button {
                flex: 1;
                min-width: 0;
                min-height: 44px;
                padding: 10px 12px;
                cursor: pointer;
                font: 500 11px/1.3 var(--mono);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--dim);
                background: none;
                border: 0;
                border-top: 1px solid var(--line);
                text-align: left;
            }

            .pager button + button {
                text-align: right;
            }

            .pager button:hover {
                border-color: var(--ice);
                color: var(--ice);
            }

            .pager button:focus-visible {
                outline: 2px solid var(--bone);
                outline-offset: 3px;
            }

            body.dragging .world {
                cursor: grabbing;
            }

            .node {
                cursor: pointer;
            }

            .panel .rv {
                opacity: 0;
            }

            .panel.open .rv {
                animation: rise 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) both;
                animation-delay: calc(var(--d) * 90ms + 140ms);
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(18px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .panel .rv {
                    opacity: 1;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation: none !important;
                    transition: none !important;
                }

                .wordmark {
                    opacity: 1;
                }
            }
        </style>
        <canvas class="sky" id="sky" aria-hidden="true"></canvas>
        <div class="world" id="world">
            <div class="back" id="back">
                <div class="wordmark" aria-hidden="true">
                    <span>Beyond</span>
                    <span>Rayfel</span>
                </div>
            </div>
            <div class="rig" id="rig">
                <canvas class="orb" id="orbb" aria-hidden="true"></canvas>
                <nav class="nodes" id="nodesb" aria-label="Sections, far side"></nav>
                <canvas class="orb" id="orb" aria-hidden="true"></canvas>
                <canvas class="fx" id="fx" aria-hidden="true"></canvas>
                <nav class="nodes" id="nodes" aria-label="Sections"></nav>
            </div>
        </div>
        <div class="vignette" aria-hidden="true"></div>
        <header class="top">
            <div class="brand">
                <div class="logos">
                    <div class="logo">
                        <img alt="Beyond Rayfel mission patch" src="logo.png">
                    </div>
                    <div class="logo-divider"></div>
                    <a href="https://ryfl.meb.k12.tr/" target="_blank" rel="noopener noreferrer" class="logo" title="Ramazan Yaman Fen Lisesi">
                        <img alt="Ramazan Yaman Fen Lisesi Logo" src="rayfel.png" style="transform: scale(1.5);">
                    </a>
                </div>
                <div class="school">
                    <h1>Beyond Rayfel</h1>
                    <p>Ramazan Yaman Science High School · NASA Space Apps 2026</p>
                </div>
            </div>
            <a href="https://www.spaceappschallenge.org/" target="_blank" rel="noopener noreferrer" class="spaceapps-link" title="NASA Space Apps Challenge">
                <img alt="NASA Space Apps Challenge" src="spaceApps.png" class="spaceapps-logo">
            </a>
        </header>
        <p class="hint" id="hint">Drag the ring or pick a point</p>
        <footer class="bottom">
            <span>Mars expedition survival route</span>
            <span class="clocks">
                <span>
                    Kırklareli Lüleburgaz <b id="clock">--:--</b>
                </span>
                <span>
                    Mars <b id="sol">sol --</b>
                    <b id="mtc">--:--</b>
                </span>
            </span>
        </footer>
        <aside class="panel" id="panel" role="dialog" aria-labelledby="panel-title" hidden>
            <button class="close" id="close" type="button" aria-label="Close section">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" fill="none"/>
                </svg>
            </button>
            <p class="eyebrow rv" style="--d:0">Ring section</p>
            <h2 class="rv" id="panel-title" style="--d:1"></h2>
            <div class="empty rv" style="--d:2">
                <p>Nothing here yet.</p>
                <p class="dim">This section is waiting for the team to fill it in.</p>
            </div>
            <nav class="pager rv" style="--d:3" aria-label="Switch section">
                <button type="button" id="prev"></button>
                <button type="button" id="next"></button>
            </nav>
        </aside>
        <script>
            (function() {
                'use strict';
                var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                var sky = document.getElementById('sky')
                  , orb = document.getElementById('orb')
                  , orbB = document.getElementById('orbb')
                  , nodesBEl = document.getElementById('nodesb')
                  , fx = document.getElementById('fx');
                var rig = document.getElementById('rig')
                  , back = document.getElementById('back');
                var world = document.getElementById('world')
                  , nodesEl = document.getElementById('nodes');
                var hint = document.getElementById('hint');
                var sctx = sky.getContext('2d')
                  , octx = orb.getContext('2d')
                  , bctx = orbB.getContext('2d')
                  , fctx = fx.getContext('2d');
                var par = {
                    x: 0,
                    y: 0
                }
                  , parT = {
                    x: 0,
                    y: 0
                };

                var TAU = Math.PI * 2;
                var ELEV = 22 * Math.PI / 180
                  , PSI = -22 * Math.PI / 180;
                var K = Math.sin(ELEV)
                  , COSP = Math.cos(PSI)
                  , SINP = Math.sin(PSI);
                var RING_IN = 1.30
                  , RING_OUT = 2.17
                  , NODE_R = 1.74;
                var PL_START = 0.5
                  , PL_DUR = 2.6
                  , RG_START = 3.0
                  , RG_DUR = 2.0
                  , NODES_AT = 4.3;

                var SECTIONS = [{
                    id: 'team-info',
                    label: 'Team info',
                    url: 'team.html'
                }, {
                    id: 'team-projects',
                    label: 'Team projects',
                    url: 'team-projects.html'
                }, {
                    id: 'mission-log',
                    label: 'Mission log',
                    url: 'mission-log.html'
                }, {
                    id: 'resources',
                    label: 'Resources',
                    url: 'resources.html'
                }, {
                    id: 'contact',
                    label: 'Contact',
                    url: 'contact.html'
                }];

                var W, H, DPR, R, CX, CY, planetTex, ringBack, ringFront, ringSize, bgCanvas, stars = [];
                var lastNow = 0
                  , t0 = null
                  , tNow = 0
                  , introDone = false
                  , nodesShown = false;

                function clamp(v, a, b) {
                    return v < a ? a : v > b ? b : v;
                }
                function lerp(a, b, t) {
                    return a + (b - a) * t;
                }
                function smooth(a, b, x) {
                    var t = clamp((x - a) / (b - a), 0, 1);
                    return t * t * (3 - 2 * t);
                }
                function easeOutQuart(t) {
                    return 1 - Math.pow(1 - t, 4);
                }
                function easeOutCubic(t) {
                    return 1 - Math.pow(1 - t, 3);
                }
                function mulberry32(a) {
                    return function() {
                        a |= 0;
                        a = a + 0x6D2B79F5 | 0;
                        var t = Math.imul(a ^ a >>> 15, 1 | a);
                        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                        return ((t ^ t >>> 14) >>> 0) / 4294967296;
                    }
                    ;
                }
                function hash(x, y) {
                    var h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
                    h = Math.imul(h ^ (h >>> 13), 1274126177);
                    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
                }
                function vnoise(x, y) {
                    var xi = Math.floor(x)
                      , yi = Math.floor(y)
                      , xf = x - xi
                      , yf = y - yi;
                    var u = xf * xf * (3 - 2 * xf)
                      , v = yf * yf * (3 - 2 * yf);
                    var a = hash(xi, yi)
                      , b = hash(xi + 1, yi)
                      , c = hash(xi, yi + 1)
                      , d = hash(xi + 1, yi + 1);
                    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
                }
                function fbm1(t) {
                    return vnoise(t, 0.5) * 0.5 + vnoise(t * 2.1, 1.5) * 0.3 + vnoise(t * 4.3, 2.5) * 0.2;
                }

                /* ---------- sky ---------- */
                function buildBackground() {
                    bgCanvas = document.createElement('canvas');
                    bgCanvas.width = Math.round(W * DPR);
                    bgCanvas.height = Math.round(H * DPR);
                    var g = bgCanvas.getContext('2d');
                    g.scale(DPR, DPR);
                    g.fillStyle = '#06070c';
                    g.fillRect(0, 0, W, H);
                    var m = Math.max(W, H);
                    function glow(x, y, r, rgba) {
                        var gr = g.createRadialGradient(x, y, 0, x, y, r);
                        gr.addColorStop(0, rgba);
                        gr.addColorStop(1, 'rgba(0,0,0,0)');
                        g.fillStyle = gr;
                        g.fillRect(0, 0, W, H);
                    }
                    glow(W * 0.5, H * 0.5, m * 0.75, 'rgba(34,46,66,0.30)');
                }
                function buildStars() {
                    var rng = mulberry32(2026)

                        par.x += (parT.x - par.x) * 0.05;
                        par.y += (parT.y - par.y) * 0.05;
                        rig.style.transform = 'translate3d(' + (par.x * -12).toFixed(2) + 'px,' + (par.y * -9).toFixed(2) + 'px,0)';
                        back.style.transform = 'translate3d(' + (par.x * -5).toFixed(2) + 'px,' + (par.y * -4).toFixed(2) + 'px,0)';
                    }
                    drawSky(t);
                    renderOrb(t);
                    if (t > RG_START + RG_DUR)
                        introDone = true;
                    drawFx(t);
                    if (!nodesShown && t > NODES_AT)
                        showNodes();
                    requestAnimationFrame(frame);
                }
                createNodes();
                setup();
                var rt;
                window.addEventListener('resize', function() {
                    clearTimeout(rt);
                    rt = setTimeout(function() {
                        setup();
                        if (introDone)
                            renderOrb(99);
                    }, 120);
                });
                window.addEventListener('pointermove', function(e) {
                    parT.x = (e.clientX / W - 0.5) * 2;
                    parT.y = (e.clientY / H - 0.5) * 2;
                });
                ['pointerdown', 'wheel', 'keydown'].forEach(function(ev) {
                    window.addEventListener(ev, function() {
                        hint.classList.add('off');
                    }, {
                        once: true,
                        passive: true
                    });
                });
                var dr = null;
                window.addEventListener('pointerdown', function(e) {
                    if (e.target.closest && e.target.closest('.panel, .top, .bottom'))
                        return;
                    dr = {
                        x: e.clientX,
                        t: performance.now(),
                        moved: 0
                    };
                    dragMoved = false;
                });
                window.addEventListener('pointermove', function(e) {
                    if (!dr)
                        return;
                    var dx = e.clientX - dr.x;
                    dr.moved += Math.abs(dx);
                    if (dr.moved > 6 && !spin.drag) {
                        dragMoved = true;
                        spin.drag = true;
                        spin.target = null;
                        document.body.classList.add('dragging');
                    }
                    if (spin.drag) {
                        var now = performance.now()
                          , dth = -dx / (NODE_R * R)
                          , dtt = Math.max(0.008, (now - dr.t) / 1000);
                        spin.a += dth;
                        spin.v = spin.v * 0.6 + (dth / dtt) * 0.4;
                        dr.t = now;
                    }
                    dr.x = e.clientX;
                });
                function endDrag() {
                    if (dr && spin.drag && performance.now() - dr.t > 90)
                        spin.v = 0;
                    spin.v = clamp(spin.v, -4, 4);
                    dr = null;
                    spin.drag = false;
                    document.body.classList.remove('dragging');
                    setTimeout(function() {
                        dragMoved = false;
                    }, 0);
                }
                window.addEventListener('pointerup', endDrag);
                window.addEventListener('pointercancel', endDrag);
                window.addEventListener('wheel', function(e) {
                    if (e.target.closest && e.target.closest('.panel'))
                        return;
                    spin.target = null;
                    spin.v = clamp(spin.v - (e.deltaY + e.deltaX) * 0.002, -4, 4);
                }, {
                    passive: true
                });
                window.addEventListener('pointerdown', function() {
                    if (!introDone && t0 !== null && !reduce)
                        t0 = performance.now() - 5200;
                });
                requestAnimationFrame(frame);
            }
            )();
        </script>
    </body>
</html>
