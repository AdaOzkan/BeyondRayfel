<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Team Info · Beyond Rayfel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <style>
        @font-face {
            font-family: 'KHInterferenceF1-Regular';
            src: url('KHInterferenceTRIAL-Regular.otf') format('opentype');
            font-display: swap;
        }
        :root {
            --void: #06070c;
            --bone: #ece3d0;
            --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
            --title: 'KHInterferenceF1-Bold', 'KHInterferenceF1-Regular', var(--display);
            --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--void);
            color: var(--bone);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.7;
        }

        .sky {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top, 0px) + 40px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(16px, env(safe-area-inset-left, 0px));
        }

        /* the blank, semi-transparent blurred box */
        .box {
            width: min(920px, 100%);
            min-height: 70vh;
            padding: clamp(24px, 5vw, 56px);
            border-radius: 28px;
            background: rgba(10, 14, 28, 0.35);
            border: 1px solid rgba(244, 241, 232, 0.16);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .return {
            position: fixed;
            z-index: 10;
            top: calc(env(safe-area-inset-top, 0px) + 16px);
            left: max(16px, env(safe-area-inset-left, 0px));
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 0 16px;
            color: var(--bone);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            border: 1px solid rgba(244, 241, 232, 0.24);
            border-radius: 999px;
            background: rgba(10, 14, 28, 0.35);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            transition: border-color .2s, color .2s;
        }

        .return:hover { border-color: #f4f1e8; color: #f4f1e8; }

        .box h1 {
            margin: 0 0 28px;
            text-align: center;
            font-family: var(--title);
            font-weight: normal;
            font-size: clamp(38px, 7vw, 72px);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .box p {
            margin: 0 0 1em;
            text-align: left;
        }

        .eyebrow {
            margin: 0 0 10px;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #d49a58;
        }
        .box h1 { margin-bottom: 20px; }
        .rule {
            height: 1px;
            margin: 0 0 32px;
            border: 0;
            background: linear-gradient(90deg, transparent, rgba(244,241,232,.35), transparent);
        }
        .dia {
            width: 9px; height: 9px; flex: none;
            border: 1.5px solid #f4f1e8;
            background: #06070c;
            transform: rotate(45deg);
            box-shadow: 0 0 0 4px rgba(244,241,232,.12);
            transition: background .2s, box-shadow .2s;
        }

        .school {
            margin: 0 0 32px; text-align: center;
            font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #8a92a8;
        }
        .school b { color: #ece3d0; font-weight: 500; }
        .crew { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .crew li {
            display: flex; align-items: center; gap: 18px;
            padding: 18px 20px;
            border: 1px solid rgba(244,241,232,.16);
            border-radius: 16px;
            background: rgba(244,241,232,.04);
            transition: border-color .25s, background .25s, transform .25s;
        }
        .crew li:hover { border-color: rgba(244,241,232,.5); background: rgba(244,241,232,.08); transform: translateY(-2px); }
        .crew li:hover .dia { background: #f4f1e8; box-shadow: 0 0 0 6px rgba(244,241,232,.2), 0 0 24px rgba(244,241,232,.5); }
        .crew .no { display: block; font-size: 10px; letter-spacing: .22em; color: #d49a58; }
        .crew .nm { display: block; margin-top: 4px; font: 800 24px/1.05 'Big Shoulders Display','Arial Narrow',Impact,sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    </style>
</head>
<body>
    <canvas class="sky" id="sky" aria-hidden="true"></canvas>

    <a class="return" href="https://beyondrayfel.com">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        Return
    </a>

    <main>
        <section class="box">
            <p class="eyebrow">The crew</p>
            <h1>Team Info</h1>
            <hr class="rule">
            <p class="school"><b>Ramazan Yaman Science High School</b></p>
            <ul class="crew">
                <li><span class="dia"></span><span><span class="no">CREW 01</span><span class="nm">Kutay Yurdakul</span></span></li>
                <li><span class="dia"></span><span><span class="no">CREW 02</span><span class="nm">Sarp Ekici</span></span></li>
                <li><span class="dia"></span><span><span class="no">CREW 03</span><span class="nm">Ada Özkan</span></span></li>
                <li><span class="dia"></span><span><span class="no">CREW 04</span><span class="nm">Utku Tuna Denizli</span></span></li>
                <li><span class="dia"></span><span><span class="no">CREW 05</span><span class="nm">Çınar Özcan</span></span></li>
            </ul>
        </section>
    </main>

    <script>
    (function () {
        'use strict';
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var cv = document.getElementById('sky'), ctx = cv.getContext('2d');
        var W, H, DPR, stars = [], bg, TAU = Math.PI * 2;

        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                var t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function build() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

            bg = document.createElement('canvas');
            bg.width = cv.width; bg.height = cv.height;
            var g = bg.getContext('2d');
            g.scale(DPR, DPR);
            g.fillStyle = '#06070c';
            g.fillRect(0, 0, W, H);
            var gr = g.createRadialGradient(W * .5, H * .5, 0, W * .5, H * .5, Math.max(W, H) * .75);
            gr.addColorStop(0, 'rgba(34,46,66,0.30)');
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = gr;
            g.fillRect(0, 0, W, H);

            var rng = mulberry32(2026);
            var n = Math.max(160, Math.min(800, Math.round(W * H / 2800)));
            var cols = ['236,227,208', '236,227,208', '169,214,240', '212,154,88'];
            var depths = [0.25, 0.55, 1];
            stars = [];
            for (var i = 0; i < n; i++) {
                var d = depths[Math.floor(rng() * 3)];
                stars.push({
                    x: rng() * W, y: rng() * H, d: d,
                    r: (0.35 + rng() * 0.85) * (0.6 + d * 0.6),
                    ph: rng() * TAU, sp: 0.6 + rng() * 1.8,
                    c: cols[Math.floor(rng() * cols.length)]
                });
            }
        }

        function frame(ms) {
            var t = ms / 1000;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.globalAlpha = 1;
            ctx.drawImage(bg, 0, 0, W, H);
            var fade = Math.min(t / 1.2, 1);
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                var tw = reduce ? 1 : 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
                ctx.globalAlpha = fade * tw * (0.3 + 0.7 * s.d);
                ctx.fillStyle = 'rgb(' + s.c + ')';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(frame);
        }

        window.addEventListener('resize', build);
        build();
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
